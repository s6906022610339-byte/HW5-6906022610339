<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <title>AURA Acoustics</title>

    <link rel="stylesheet" href="gridstyle.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>
            <img src="header.jpg" alt="AURA Acoustics">
        </header>


        <!-- Menu -->
        <nav>
            <a href="index.html">Home</a>
            <a href="product.html">Products</a>
        </nav>


        <!-- Content -->
        <div class="content">

            <!-- ด้านซ้าย -->
            <main>

                <section class="box">

                    <h2>ยินดีต้อนรับสู่ร้านของเรา</h2>

                    <p>
                        เรามีสินค้าหลากหลายและราคาพิเศษสำหรับคุณ
                    </p>

                    <img src="shop.jpg" alt="ร้าน AURA Acoustics">

                </section>


                <section class="box">

                    <h2>ร้านอยู่จังหวัดปราจีนบุรี</h2>

                    <p>
                        การเดินทางสะดวกและมีเส้นทางที่ชัดเจน
                    </p>

                    <img src="map.png" alt="แผนที่ร้าน">

                </section>

            </main>


            <!-- ด้านขวา -->
            <aside>

                <h3>สมัครสมาชิก</h3>

                <form>

                    <label>ชื่อ</label>
                    <br>

                    <input type="text" placeholder="ชื่อจริง">
                    <br><br>


                    <label>นามสกุล</label>
                    <br>

                    <input type="text" placeholder="นามสกุล">
                    <br><br>


                    <label>อีเมล</label>
                    <br>

                    <input type="email" placeholder="example@domain.com">
                    <br><br>


                    <label>รหัสผ่าน</label>
                    <br>

                    <input type="password" placeholder="อย่างน้อย 8 ตัวอักษร">
                    <br><br>


                    <label>ยืนยันรหัสผ่าน</label>
                    <br>

                    <input type="password" placeholder="ยืนยันรหัสผ่าน">
                    <br><br>


                    <label>เบอร์โทรศัพท์</label>
                    <br>

                    <input type="text" placeholder="065-xxx-xxxx">
                    <br><br>


                    <label>เพศ</label>
                    <br>

                    <input type="radio" name="gender">
                    ชาย
                    <br>

                    <input type="radio" name="gender">
                    หญิง
                    <br>

                    <input type="radio" name="gender">
                    ไม่ระบุ

                    <br><br>


                    <input type="checkbox">
                    รับข่าวสาร

                    <input type="checkbox">
                    โปรโมชั่น

                    <input type="checkbox">
                    กิจกรรม

                    <br><br>


                    <label>ประเภทสมาชิก</label>
                    <br>

                    <select>
                        <option>Premium</option>
                        <option>VIP</option>
                        <option>Normal</option>
                    </select>

                    <br><br>


                    <input type="checkbox">
                    ยอมรับข้อความและเงื่อนไข

                    <br><br>


                    <button type="submit">
                        สมัครสมาชิก
                    </button>

                    <br>

                    <p class="small-text">
                        เราจะเก็บข้อมูลของคุณไว้เป็นความลับ
                    </p>

                </form>

            </aside>

        </div>


        <!-- Footer -->
        <footer>

            <img src="footer.jpg" alt="AURA Acoustics">

        </footer>

    </div>

</body>

</html>
